name: Build

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERBOSE: 1
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-fltk1.3 mingw-w64-ucrt-x86_64-libjpeg-turbo \
            mingw-w64-ucrt-x86_64-gnutls mingw-w64-ucrt-x86_64-pixman \
            mingw-w64-ucrt-x86_64-nettle mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-gtest
      - name: Configure
        run: cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DENABLE_NLS=ON -DENABLE_H264=ON -DENABLE_GNUTLS=ON -DENABLE_NETTLE=ON -DBUILD_VIEWER=ON -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        env:
          MSYS2_PATH_TYPE: inherit
        run: make installer winvnc_installer
      - name: Test
        working-directory: build
        continue-on-error: true
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Stage raw package
        working-directory: build
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p pkg/locale
          cp vncviewer/vncviewer.exe pkg/vncviewer.exe
          cp win/vncconfig/vncconfig.exe pkg/vncconfig.exe
          cp win/winvnc/winvnc4.exe pkg/winvnc4.exe
          cp win/wm_hooks/wm_hooks.dll pkg/wm_hooks.dll
          cp ../README.rst pkg/README.rst
          cp ../LICENCE.TXT pkg/LICENCE.TXT
          for mo in po/*.mo; do
            lang=$(basename "$mo" .mo)
            mkdir -p "pkg/locale/$lang/LC_MESSAGES"
            cp "$mo" "pkg/locale/$lang/LC_MESSAGES/tigervnc.mo"
          done
          missing=0
          for f in pkg/vncviewer.exe pkg/vncconfig.exe pkg/winvnc4.exe pkg/wm_hooks.dll pkg/README.rst pkg/LICENCE.TXT; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          find pkg -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: build/release/tigervnc*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/pkg
