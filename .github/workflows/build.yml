name: Build

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERBOSE: 1
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-fltk1.3 mingw-w64-ucrt-x86_64-libjpeg-turbo \
            mingw-w64-ucrt-x86_64-gnutls mingw-w64-ucrt-x86_64-pixman \
            mingw-w64-ucrt-x86_64-nettle mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-gtest
      - name: Configure
        run: cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DENABLE_NLS=ON -DENABLE_H264=ON -DENABLE_GNUTLS=ON -DENABLE_NETTLE=ON -DBUILD_VIEWER=ON -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        env:
          MSYS2_PATH_TYPE: inherit
        run: make installer winvnc_installer
      - name: Test
        working-directory: build
        continue-on-error: true
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Stage raw package
        working-directory: build
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p pkg/locale
          cp vncviewer/vncviewer.exe pkg/vncviewer.exe
          cp win/vncconfig/vncconfig.exe pkg/vncconfig.exe
          cp win/winvnc/winvnc4.exe pkg/winvnc4.exe
          cp win/wm_hooks/wm_hooks.dll pkg/wm_hooks.dll
          cp ../README.rst pkg/README.rst
          cp ../LICENCE.TXT pkg/LICENCE.TXT
          for mo in po/*.mo; do
            lang=$(basename "$mo" .mo)
            mkdir -p "pkg/locale/$lang/LC_MESSAGES"
            cp "$mo" "pkg/locale/$lang/LC_MESSAGES/tigervnc.mo"
          done

          # Collect non-system runtime DLLs that ldd resolves from the MSYS2
          # UCRT64 toolchain; system and UCRT DLLs resolve under /c/WINDOWS and
          # are intentionally excluded.
          ldd_list=$(mktemp)
          for pe in vncviewer/vncviewer.exe win/vncconfig/vncconfig.exe \
                    win/winvnc/winvnc4.exe win/wm_hooks/wm_hooks.dll; do
            ldd "$pe"
          done | grep -E '/(ucrt64|mingw64|msys64)/bin/' \
              | sed -E 's/^[[:space:]]*[^=]+=>[[:space:]]+([^[:space:]]+).*/\1/' \
              | sort -u > "$ldd_list"
          echo "==== ldd-resolved MSYS2 DLLs ===="
          cat "$ldd_list"
          while read -r dll_path; do
            cp "$dll_path" pkg/
          done < "$ldd_list"
          rm -f "$ldd_list"

          missing=0
          for f in pkg/vncviewer.exe pkg/vncconfig.exe pkg/winvnc4.exe \
                   pkg/wm_hooks.dll pkg/README.rst pkg/LICENCE.TXT; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          required_dlls="libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll \
            libgmp-10.dll libgnutls-30.dll libhogweed-7.dll libjpeg-8.dll \
            libnettle-9.dll libpixman-1-0.dll zlib1.dll libfltk.dll libintl-8.dll"
          for f in $required_dlls; do
            if [ ! -f "pkg/$f" ]; then
              echo "MISSING: pkg/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          find pkg -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: build/release/tigervnc*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/pkg
